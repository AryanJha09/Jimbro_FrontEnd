name: jimbro
description: "AI-ready fitness tracking app"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.9.1

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.0

  # Local persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Model generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - .env
